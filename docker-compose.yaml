services:
  db:
    image: postgres:18.4
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTEGES_USER}
      POSTGRES_PASSWORD: ${POSTEGES_PASSWORD}
      POSTGRES_DB: ${POSTEGES_DB}
    ports:
      - "5432"
    volumes:
      - psql_data:/var/lib/postgresql/data

    backe_end:
      build: .
      restart: always
      container_name: flasck_python
      ports:
        - "5011:5000"
      env_file:
      - path: .env
        required: false

volumes:
  psql_data: